    cellId: 18a13d48-53c3-4493-a1e4-d62b55e210e9 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |-
        According to this function, our data has

        * 469,344 rows
        * 13 columns
        * No null values 😮‍💨
        * 7 string columns, 4 float columns, and 2 integer columns

        Although this tells us a lot more about the data itself, it doesn't give us much insight into the *values* of our data. We know nothing about the range of our numerical columns, what an average value looks like, or if we might have any outliers present in our dataset. Knowing this information is crucial when exploring data so we'll call the pandas `.describe()` method which will output a [5 number summary](https://www.analyticsvidhya.com/blog/2021/05/five-number-summary-for-analysis/) for each numerical variable in our dataset.
