  - cellType: MARKDOWN
    cellId: 92d537bc-2876-4fb1-ac84-68763342dc59 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |-
        # Feature Engineering
        Feature engineering is the process of manipulating your data such that columns are created, updated, or deleted. The motivations behind feature engineering will differ between projects but for our purposes, we'll use it to add a column that has the coordinates for each venue and project the most popular places onto a map. We can use the `pgeocode` package to extract coordinates from any valid zip code.
  - cellType: CODE
    cellId: 46422713-e97c-431d-842d-693661329abd # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |-
        def add_coordinates(frame):
            '''
                Accepts a dataframe and returns it with the new columns lat and lng
            '''
            # create geocoding object
            nomi = pgeocode.Nominatim('us')
            frame = frame.copy()
            # list of each unique zip code
            unique_zips = frame['ZIP'].unique().tolist()
            coordinates = {}
            # for each unique zip code
            for zipcode in unique_zips:
                # get the location data
                location = nomi.query_postal_code(zipcode)
                # extract and add the coordinates to our coordinate dictionary
                coordinates.setdefault(zipcode, {'lat':location.latitude, 'lng':location.longitude})
            # add the coordinates to the dataframe
            frame['lat'] = frame['ZIP'].apply(lambda row: coordinates[row]['lat'])
            frame['lng'] = frame['ZIP'].apply(lambda row: coordinates[row]['lng'])

            return frame, coordinates

        cleaned_data, coordinates = add_coordinates(cleaned_data)
