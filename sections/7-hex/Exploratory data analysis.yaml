    config:
      source: |-
        # What is exploratory data analysis?
        Exploratory data analysis or EDA is the process of investigating your data to understand its structure. Exploring your data can help you find any missing values, outliers, or give you some insight into unknown relationships. It's also a great way to answer questions you have like, "Which venues in my city do people visit most often?" or "How does humidity affect how long people would stay at a venue?" Using different methods to inspect your data can help you answer these questions and prepare you for more sophisticated analytical or modeling techniques. 
