    config:
      richText:
        - type: h1
          children:
            - text: Handling outliers
        - type: paragraph
          children:
            - text: "This summary gives us a feel for the boundaries of our variables and can point at initial hints of any anomalies that may be present, such as outliers. Speaking of outliers,  take a look at the "
            - code: true
              text: visit_duration
            - text: " column and see if you notice anything a bit off. A picture is worth 1000 words so let's visualize this column in a boxplot to accentuate any anomalies that aren't apparent from the summary."
  - cellType: MARKDOWN
    cellId: 33fb9db8-eb68-457c-bfd6-9630775e5435 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |
        _It may not be very obvious but look at the standard deviation when compared to the mean. Intuitively, the mean tells you the value that lies at the center of your data, while the standard deviation tells you how spread out your data is around the mean. Our data says that the average `visit_duration` is 38 minutes with a spread of $$\pm$$ 99 minutes, which means that some people could be visiting venues for at least -65 minutes. Unfortunately, this is physically impossible and leads me to believe that there are some outliers throwing off our data._ 

        _Another thing to notice is that the max `visit_duration` is 85x bigger than the `visit_duration` in the 3rd quartile. The 3rd quartile tells us the value under which 75% of the data can be found when arranged in increasing order. This means that of all the people who visit venues, 75% of them spend 34 minutes or less at their venue of choice. Then that number suddenly jumps up to 2,648 minutes 😳._ 
  - cellType: CODE
    cellId: 49ebacaf-ab55-4a27-ab18-55c5794f8a83 # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: |-
        sns.set(rc = {'figure.figsize':(15,8)})
        sns.boxplot(x = data['VISIT_DURATION'], y = data['CITY_NAME']);
  - cellType: MARKDOWN
    cellId: cc649dcc-9278-45bb-a470-a96f8a3cd3aa # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: null
    config:
      source: The only thing you may be able to gather from this plot is that outliers are most definitely present. To detect which values are outliers, we'll use the [IQR approach](https://towardsdatascience.com/why-1-5-in-iqr-method-of-outlier-detection-5d07fdc82097) and remove any values that fall outside the upper and lower bounds of our results.
  - cellType: CODE
    cellId: 3ba81205-98b8-43e6-a0e0-8c6a6850aa3d # DO NOT CHANGE - Hex uses this to match up cells when reimporting the file, and detect any changes to existing cells
    cellLabel: Cleaned data
    config:
      source: |-
        def outliers(values):
            q1, q3 = np.percentile(values, [25, 75])
            iqr = q3 - q1
            lower = q1 - (1.5 * iqr)
            upper = q3 + (1.5 * iqr)
            return lower, upper

        # calculate the lower and upper outlier limit
        lower, upper = outliers(data['VISIT_DURATION'])

        # create filters that remove all rows the fall outside of these limits
        lower_mask = (data['VISIT_DURATION'] > lower)
        upper_mask = (data['VISIT_DURATION'] < upper)

        # apply the filters to the dataset
        cleaned_data = data[lower_mask & upper_mask]
  - cellType: CODE
